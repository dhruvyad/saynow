<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>saynow</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --edge: rgba(255, 255, 255, 0.09);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.42);
        --field: rgba(255, 255, 255, 0.055);
        --field-focus: rgba(255, 255, 255, 0.085);
        --radius: 18px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter,
          system-ui, sans-serif;
      }

      /* Standalone preview only: the native panel is already transparent and
         sized, so this padding is a no-op there. */
      body {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0;
      }

      body.preview {
        padding: 24px;
        background:
          radial-gradient(1200px 600px at 80% 90%, #1c1c1e 0%, #0f0f10 55%, #09090a 100%);
      }

      .bubble {
        position: relative;
        width: 100%;
        max-width: 400px;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        padding: 16px 16px 14px;
        color: var(--text);
        box-shadow:
          0 1px 0 0 rgba(255, 255, 255, 0.05) inset,
          0 12px 32px -8px rgba(0, 0, 0, 0.7),
          0 2px 8px -2px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateY(10px) scale(0.985);
        animation: enter 0.42s var(--ease) forwards;
        overflow: hidden;
      }

      body.preview .bubble {
        backdrop-filter: blur(20px) saturate(140%);
        background: rgba(10, 10, 10, 0.86);
      }

      @keyframes enter {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .bubble.leaving {
        animation: leave 0.26s var(--ease) forwards;
      }

      @keyframes leave {
        to {
          opacity: 0;
          transform: translateY(6px) scale(0.985);
        }
      }

      /* ---- resize handle ------------------------------------------------ */

      /* A strip along the top edge, inside the bubble's own padding so it
         never sits on a button. Drag it up for more of the transcript, down
         for less. */
      .grip {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 12px;
        cursor: ns-resize;
        /* Or the drag is claimed as a scroll before the first move arrives. */
        touch-action: none;
      }

      .grip::after {
        content: '';
        display: block;
        width: 32px;
        height: 3px;
        margin: 4px auto 0;
        border-radius: 2px;
        background: rgba(245, 245, 245, 0.22);
        opacity: 0;
        transition: opacity 0.16s ease, background 0.16s ease;
      }

      /* Only once the pointer is on the bubble: a bar drawn across the top of
         every announcement reads as part of the design rather than as
         something to take hold of. */
      .bubble:hover .grip::after { opacity: 1; }

      .grip:hover::after,
      .bubble.resizing .grip::after {
        opacity: 1;
        background: rgba(245, 245, 245, 0.42);
      }

      /* A drag that crosses the transcript would otherwise select it. */
      .bubble.resizing { user-select: none; }

      /* ---- header ------------------------------------------------------ */

      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 11px;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 2.5px;
        height: 14px;
      }

      .mark i {
        display: block;
        width: 2.5px;
        height: 14px;
        border-radius: 1.5px;
        background: var(--text);
        /* Scale about the centre so the bar breathes symmetrically, the way a
           waveform does, rather than growing out of the baseline. */
        transform-origin: center;
        transform: scaleY(0.22);
        animation-name: wave;
        animation-iteration-count: infinite;
        /* ease-in-out spends time at the extremes, which reads as a swell.
           A snappy ease reads as a flicker at this size. */
        animation-timing-function: ease-in-out;
        will-change: transform;
      }

      /* Slow and non-harmonic. One swell per bar per ~3s means roughly one
         direction change a second, which reads as breathing. The earlier
         version packed six reversals into a second, which reads as flicker. */
      .mark i:nth-child(1) { animation-duration: 3.10s; animation-delay: -2.40s; opacity: 0.45; }
      .mark i:nth-child(2) { animation-duration: 2.30s; animation-delay: -0.90s; opacity: 0.70; }
      .mark i:nth-child(3) { animation-duration: 2.70s; animation-delay: -0.10s; opacity: 0.95; }
      .mark i:nth-child(4) { animation-duration: 2.50s; animation-delay: -1.70s; opacity: 0.70; }
      .mark i:nth-child(5) { animation-duration: 3.40s; animation-delay: -2.90s; opacity: 0.45; }

      /* A single gentle swell per cycle — no intermediate reversals. */
      @keyframes wave {
        0%,
        100% { transform: scaleY(0.34); }
        50%  { transform: scaleY(0.92); }
      }

      /* Hold the waveform still while the voice is, rather than letting it
         carry on breathing over silence. */
      .bubble.paused .mark i { animation-play-state: paused; }

      /* Settle to a flat, quiet line once the voice stops. */
      .bubble.done .mark i {
        animation: none;
        transform: scaleY(0.16);
        opacity: 0.3;
        transition:
          transform 0.5s var(--ease),
          opacity 0.5s var(--ease);
      }

      /* The default is a wordmark, so it takes the small-caps treatment:
         uppercase, tracked out, quiet. */
      .label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        flex: 1;
      }

      /* A sender is a name, not a wordmark. Uppercase and tracking make a
         name shouty and slower to read, so drop both and let it sit at a
         normal size with the weight doing the work. */
      .label.named {
        font-size: 12.5px;
        font-weight: 590;
        letter-spacing: -0.005em;
        text-transform: none;
        color: rgba(245, 245, 245, 0.82);
      }

      /* Whatever follows the separator is context, so it recedes. */
      .label .task {
        font-weight: 450;
        color: var(--muted);
      }

      .label .task::before {
        content: '·';
        margin: 0 5px;
        color: rgba(245, 245, 245, 0.28);
      }

      .chip {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border: none;
        border-radius: 50%;
        background: var(--field);
        color: var(--text);
        cursor: pointer;
        transition: background 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
        flex-shrink: 0;
      }

      .chip:hover { background: rgba(255, 255, 255, 0.13); }
      .chip:active { transform: scale(0.92); }

      .chip svg { width: 8px; height: 8px; fill: currentColor; }

      /* There is nothing to pause when the page does not own the audio, so the
         button is not shown at all rather than shown and ignored. */
      .chip.hidden { display: none; }

      /* One button, two faces: bars while it speaks, a triangle while it does
         not. The triangle is nudged right because its visual centre sits left
         of its bounding box. It stays after the voice stops, where it means
         play it again — the same thing clicking a word does. */
      .transport .tri { display: none; }
      .bubble.paused .transport .bars { display: none; }
      .bubble.paused .transport .tri { display: block; margin-left: 1px; }

      .close svg.x {
        width: 11px;
        height: 11px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
      }

      /* ---- transcript --------------------------------------------------- */

      .transcript {
        font-size: 14.5px;
        line-height: 1.5;
        letter-spacing: -0.003em;
        /* Roughly 23 lines. Only bites on genuinely long reads — short text
           still sizes to itself, and the panel follows the content height. */
        max-height: 504px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }

      .transcript::-webkit-scrollbar { display: none; }

      .transcript w {
        opacity: 0.26;
        transition: opacity 0.34s var(--ease);
      }

      .transcript w.said { opacity: 1; }

      /* Every word is a place to start from, but only when the page owns the
         audio — with the system voice speaking for itself there is no playhead
         to move, and a word that invites a click it cannot honour is worse
         than one that never invited it. */
      .transcript.seekable w {
        cursor: pointer;
        border-radius: 3px;
      }

      .transcript.seekable w:hover {
        background: rgba(255, 255, 255, 0.1);
        /* A spread shadow pads the highlight without reflowing the line, which
           padding on an inline element would. */
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
      }

      /* Brighten rather than dim: an unsaid word under the pointer is the one
         about to be spoken. */
      .transcript.seekable w:not(.said):hover { opacity: 0.62; }

      /* ---- rendered markdown -------------------------------------------- */

      .transcript.rich > :first-child { margin-top: 0; }
      .transcript.rich > :last-child { margin-bottom: 0; }

      .rich h1, .rich h2, .rich h3, .rich h4 {
        margin: 14px 0 6px;
        line-height: 1.3;
        letter-spacing: -0.012em;
      }

      .rich h1 { font-size: 17px; font-weight: 640; }
      .rich h2 { font-size: 15.5px; font-weight: 620; }
      .rich h3, .rich h4 { font-size: 14.5px; font-weight: 600; }

      .rich p { margin: 8px 0; }

      .rich ul, .rich ol { margin: 8px 0; padding-left: 18px; }
      .rich li { margin: 3px 0; }
      .rich li::marker { color: var(--muted); }

      .rich a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: rgba(245, 245, 245, 0.35);
        text-underline-offset: 2px;
      }

      .rich a:hover { text-decoration-color: var(--text); }

      .rich code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        padding: 1px 5px;
        border-radius: 5px;
        background: var(--field);
      }

      .rich pre {
        margin: 10px 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--field);
        overflow-x: auto;
      }

      .rich pre code {
        padding: 0;
        background: none;
        font-size: 12px;
        line-height: 1.5;
        /* Not spoken, so never dimmed — it is reference material, not narration. */
        opacity: 0.85;
      }

      .rich blockquote {
        margin: 10px 0;
        padding-left: 11px;
        border-left: 2px solid var(--edge);
        color: var(--muted);
      }

      .rich img {
        display: block;
        max-width: 100%;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid var(--edge);
      }

      .rich hr {
        margin: 12px 0;
        border: none;
        border-top: 1px solid var(--edge);
      }

      .rich table {
        width: 100%;
        margin: 10px 0;
        border-collapse: collapse;
        font-size: 13px;
      }

      .rich th, .rich td {
        padding: 5px 8px;
        text-align: left;
        border-bottom: 1px solid var(--edge);
      }

      .rich th {
        font-weight: 600;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .rich tr:last-child td { border-bottom: none; }

      /* ---- reply -------------------------------------------------------- */

      .reply {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        margin-top: 13px;
      }

      .reply.hidden { display: none; }

      /* Pasted images sit on their own row above the box, inside the reply so
         that sending or hiding it takes them along. */
      .attachments {
        display: flex;
        gap: 6px;
        flex-basis: 100%;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .attachments.hidden { display: none; }
      .attachments::-webkit-scrollbar { display: none; }

      .thumb {
        position: relative;
        flex-shrink: 0;
        height: 52px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--edge);
      }

      .thumb img {
        display: block;
        height: 100%;
        min-width: 40px;
        max-width: 96px;
        object-fit: cover;
      }

      .unattach {
        position: absolute;
        top: 4px;
        right: 4px;
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border: none;
        border-radius: 50%;
        background: rgba(10, 10, 10, 0.78);
        color: var(--text);
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.14s ease;
      }

      .thumb:hover .unattach,
      .unattach:focus-visible { opacity: 1; }

      .unattach svg { width: 8px; height: 8px; stroke: currentColor; fill: none;
                      stroke-width: 1.8; stroke-linecap: round; }

      .field {
        flex: 1;
        min-width: 0;
        height: 34px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--field);
        color: var(--text);
        font: inherit;
        font-size: 13.5px;
        outline: none;
        transition: background 0.16s ease, border-color 0.16s ease;
      }

      .field::placeholder { color: rgba(245, 245, 245, 0.32); }

      .field:focus {
        background: var(--field-focus);
        border-color: rgba(255, 255, 255, 0.14);
      }

      .send {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 10px;
        background: var(--text);
        color: #0a0a0a;
        cursor: pointer;
        opacity: 0.28;
        pointer-events: none;
        transition: opacity 0.16s ease, transform 0.16s ease;
        flex-shrink: 0;
      }

      .send.ready { opacity: 1; pointer-events: auto; }
      .send:active { transform: scale(0.94); }
      .send svg { width: 14px; height: 14px; stroke: currentColor; fill: none;
                  stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

      /* ---- dismiss countdown -------------------------------------------- */

      .timer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 1.5px;
        background: rgba(255, 255, 255, 0.22);
        transform-origin: left;
        transform: scaleX(1);
        /* Hidden until a countdown actually runs. Without this it sat at full
           width along the bottom edge for the whole of every plain
           announcement, where no countdown ever starts, and read as a stray
           bright line rather than as a timer. */
        opacity: 0;
      }

      .timer.running {
        opacity: 1;
        transition: transform linear;
      }

      .timer.cancelled { opacity: 0; transition: opacity 0.2s ease; }

      .sent {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 13px;
        height: 34px;
        font-size: 13px;
        color: var(--muted);
      }

      .sent.hidden { display: none; }

      .sent svg { width: 13px; height: 13px; stroke: currentColor; fill: none;
                  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      /* Surgical, not a blanket reset. The usual `* { animation-duration:
         0.01ms }` trick leaves iteration-count at infinite, which turns any
         looping animation into a 100,000-per-second strobe — the opposite of
         what the user asked for. It also stamps on the dismiss countdown,
         whose duration is set from script. */
      @media (prefers-reduced-motion: reduce) {
        .bubble {
          animation: none;
          opacity: 1;
          transform: none;
        }

        .bubble.leaving {
          animation: none;
          opacity: 0;
          transition: opacity 0.2s linear;
        }

        /* Keep signalling "speaking", but breathe with opacity rather than
           motion — reduce-motion asks us to drop movement, not all feedback.
           Heights stay varied and slightly asymmetric so it still reads as a
           waveform rather than a flat comb. */
        .mark i {
          animation-name: breathe;
        }

        .mark i:nth-child(1) { transform: scaleY(0.38); }
        .mark i:nth-child(2) { transform: scaleY(0.74); }
        .mark i:nth-child(3) { transform: scaleY(1);    }
        .mark i:nth-child(4) { transform: scaleY(0.62); }
        .mark i:nth-child(5) { transform: scaleY(0.44); }

        /* Dim on finish, but keep the silhouette. */
        .bubble.done .mark i {
          animation: none;
          opacity: 0.3;
        }

        .send:active,
        .chip:active {
          transform: none;
        }
      }

      @keyframes breathe {
        0%,
        100% { opacity: 0.28; }
        50%  { opacity: 0.95; }
      }
    </style>
  </head>
  <body>
    <div class="bubble" id="bubble">
      <div class="grip" id="grip" title="Drag to resize" aria-hidden="true"></div>

      <div class="head">
        <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="label" id="label">saynow</div>
        <button class="chip transport hidden" id="play" title="Pause (space)" aria-label="Pause speaking">
          <svg viewBox="0 0 8 8" class="bars">
            <rect width="2.6" height="8" rx="1.1" /><rect x="5.4" width="2.6" height="8" rx="1.1" />
          </svg>
          <svg viewBox="0 0 8 8" class="tri"><path d="M1.2 0.6L7.4 4 1.2 7.4z" /></svg>
        </button>
        <button class="chip close" id="close" title="Dismiss (esc)" aria-label="Dismiss">
          <svg viewBox="0 0 12 12" class="x"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>

      <div class="transcript" id="transcript"></div>

      <div class="reply hidden" id="reply">
        <div class="attachments hidden" id="attachments"></div>
        <input
          class="field"
          id="field"
          type="text"
          placeholder="Reply…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="send" id="send" aria-label="Send reply">
          <svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7" /></svg>
        </button>
      </div>

      <div class="sent hidden" id="sentNote">
        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" /></svg>
        <span>Sent</span>
      </div>

      <div class="timer" id="timer"></div>
    </div>

    <!--SAYNOW_STATE-->
    <script>
      const DEMO = {
        text: 'Hey, saynow agent here. The migration finished and moved twelve hundred rows. Want me to drop the old table now?',
        ask: true,
        rate: 175,
        dismissMs: 5000,
      };

      const state = window.__SAYNOW__ || (document.body.classList.add('preview'), DEMO);

      // Handed to the page in its own URL and returned on every request, so
      // nothing else that can reach the port can answer on the user's behalf.
      // Declared before anything that uses it: as a const it sits in the
      // temporal dead zone until evaluated, and a reference from higher up
      // throws, which would kill the script before any handler is bound.
      const token = new URLSearchParams(location.search).get('t') ?? '';
      const withToken = (path) => `${path}${path.includes('?') ? '&' : '?'}t=${token}`;

      const el = {
        bubble: document.getElementById('bubble'),
        transcript: document.getElementById('transcript'),
        reply: document.getElementById('reply'),
        attachments: document.getElementById('attachments'),
        field: document.getElementById('field'),
        send: document.getElementById('send'),
        play: document.getElementById('play'),
        close: document.getElementById('close'),
        grip: document.getElementById('grip'),
        timer: document.getElementById('timer'),
        sent: document.getElementById('sentNote'),
        label: document.getElementById('label'),
      };

      // Only present inside WKWebView, where the panel takes its size from
      // whatever the page reports; the browser fallback has a window of its
      // own. Declared here because the resize handle has to know which shell
      // it is in, long before the block at the bottom that reports a height.
      const sizeChannel = window.webkit?.messageHandlers?.size;

      /**
       * Bound first, deliberately.
       *
       * Everything below can throw — a missing element, a bad URL, a browser
       * without some API. If that happened after the close button was wired
       * the bubble simply would not open; if it happened before, the user was
       * left with a panel that ignored its own X and sat there until the CLI
       * timed out two minutes later. So dismissal is wired before anything
       * that could fail.
       */
      function emergencyClose() {
        fetch(`/dismiss?t=${token}`, { method: 'POST' }).catch(() => {});
        fetch(`/close?t=${token}`, { method: 'POST' }).catch(() => {});
      }

      el.close.addEventListener('click', emergencyClose, { once: false });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') emergencyClose();
      });

      /* ---- transcript reveal --------------------------------------------- */

      /**
       * Build the transcript and collect one element per spoken word.
       *
       * With Markdown the transcript is structured — headings, lists, tables —
       * so the words cannot simply be laid out in a row. Instead the rendered
       * tree is walked and every word in every text node is wrapped, which
       * keeps the highlight working without flattening the document. Code
       * blocks are skipped: they are not spoken, so lighting them would
       * desynchronise everything after.
       */
      const nodes = [];

      function wrapWords(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: (node) =>
            node.parentElement.closest('pre')
              ? NodeFilter.FILTER_REJECT
              : NodeFilter.FILTER_ACCEPT,
        });

        const texts = [];
        while (walker.nextNode()) texts.push(walker.currentNode);

        for (const text of texts) {
          const parts = text.data.split(/(\s+)/);
          if (parts.length === 1 && !parts[0].trim()) continue;

          const fragment = document.createDocumentFragment();
          for (const part of parts) {
            if (!part) continue;
            if (!part.trim()) {
              fragment.append(part);
              continue;
            }
            const w = document.createElement('w');
            w.textContent = part;
            nodes.push(w);
            fragment.append(w);
          }
          text.replaceWith(fragment);
        }
      }

      if (state.html) {
        // Built by the renderer, which escapes its input and only emits tags
        // it constructed itself.
        el.transcript.innerHTML = state.html;
        el.transcript.classList.add('rich');
        wrapWords(el.transcript);
      } else {
        for (const word of state.text.split(/\s+/).filter(Boolean)) {
          const w = document.createElement('w');
          w.textContent = word;
          el.transcript.append(w, ' ');
          nodes.push(w);
        }
      }

      const words = nodes.map((n) => n.textContent);

      // Longer words take longer to say, so weight by length rather than
      // lighting every word for an equal slice.
      const weights = words.map((word) => word.length + 1);
      const totalWeight = weights.reduce((sum, w) => sum + w, 0);
      const cumulative = [];
      cumulative[words.length] = weights.reduce(
        (sum, w, i) => (cumulative[i] = sum) + w,
        0,
      );

      // The reveal animation only estimates pace, so it never starts the
      // dismiss countdown on its own — the CLI reports when audio truly ends.
      let audioEnded = !window.__SAYNOW__; // standalone preview has no audio
      let revealFinished = false;
      let revealed = 0;
      const timers = [];

      /**
       * Light the transcript up to `count` words, and dim anything past it.
       *
       * It has to go both ways now that a click can send the voice back to an
       * earlier word: a highlight that only ever grew would leave the end of a
       * sentence lit while the voice was still working its way back to it.
       */
      function revealTo(count) {
        const target = Math.max(0, Math.min(count, words.length));
        for (; revealed < target; revealed += 1) {
          nodes[revealed].classList.add('said');
          nodes[revealed].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        for (; revealed > target; revealed -= 1) {
          nodes[revealed - 1].classList.remove('said');
        }
        revealFinished = revealed >= words.length;
        if (revealFinished) maybeSettle();
      }

      /**
       * How far into a clip covering words [from, to) the word `i` falls.
       *
       * Longer words take longer to say, so this is by weight rather than by
       * count. Read forwards it tells the highlight which word to light; read
       * backwards it turns a click on a word into a place to play from.
       */
      function fractionAt(i, from, to) {
        const base = cumulative[from] ?? 0;
        const span = (cumulative[to] ?? totalWeight) - base;
        if (span <= 0) return 0;
        return Math.min(1, Math.max(0, ((cumulative[i] ?? base) - base) / span));
      }

      /**
       * Drive the highlight from the audio element's own clock.
       *
       * This is the only way to be genuinely in sync: a words-per-minute
       * estimate is wrong for every cloud voice, which ignores the rate, and
       * it starts when the page loads rather than when sound actually begins.
       * Reading currentTime is exact by construction, and self-corrects if
       * playback stalls, starts late, or is sent somewhere else entirely.
       */
      function followAudio(audio, chunk) {
        // Without a chunk this clip covers the whole transcript; with one it
        // covers a slice, and the highlight resumes where the last left off.
        const from = chunk ? chunk.firstWord : 0;
        const to = chunk ? chunk.firstWord + chunk.wordCount : words.length;

        const tick = () => {
          const { currentTime, duration } = audio;
          if (duration > 0) {
            const played = Math.min(currentTime / duration, 1);
            let count = from;
            while (count < to && fractionAt(count, from, to) <= played) count += 1;
            revealTo(count);
          }
          if (!audio.ended && !audio.paused) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      /** No audio to follow: pace off the speaking rate the system voice honours. */
      function followEstimate() {
        const perWord = 60000 / (state.rate || 175);
        words.forEach((_, i) => {
          timers.push(setTimeout(() => revealTo(i + 1), i * perWord));
        });
      }

      function maybeSettle() {
        if (!revealFinished || !audioEnded) return;
        el.bubble.classList.add('done');
        if (state.ask) startDismissTimer();
        else dismissAfter(900);
      }

      /**
       * There is speech again — resumed, or restarted from a word further up.
       *
       * The bubble stops looking finished and the countdown stands down, which
       * is only safe because the audio reaching its end starts it again. Every
       * way that can happen, including failing to play at all, goes through
       * speechEnded().
       */
      function speaking() {
        audioEnded = false;
        el.bubble.classList.remove('done');
        engage();
      }

      /** The audio is over, however it got there: hand the bubble to the timer. */
      function speechEnded() {
        audioEnded = true;
        syncTransport();
        revealTo(words.length);
      }

      let player = null;

      /**
       * Play from a given word, filled in by whichever playback mode is in use.
       *
       * Left null when the page does not own the audio: the system voice
       * speaking for itself has no playhead anyone can move. It is the single
       * signal for whether the transport button and a clickable transcript are
       * offered at all, so neither can ever appear without something behind it.
       */
      let seekAudio = null;

      /**
       * Move a clip's playhead once it knows how long it is.
       *
       * A clip only just asked for has no duration yet, and a seek against it
       * is silently dropped — so it waits for the metadata instead.
       */
      function seekFraction(audio, fraction) {
        const apply = () => {
          if (audio.duration > 0) audio.currentTime = audio.duration * fraction;
        };
        if (audio.duration > 0) apply();
        else audio.addEventListener('loadedmetadata', apply, { once: true });
      }

      /** Keep the button showing what the clip is really doing. */
      function watchPlayback(audio) {
        audio.addEventListener('play', syncTransport);
        audio.addEventListener('pause', syncTransport);
      }

      /**
       * The clip will not play at all: pace the transcript off the speaking
       * rate rather than leaving it frozen mid-sentence. There is no playhead
       * to pause or seek after this, and the button says so.
       */
      function fallBackToEstimate() {
        audioEnded = true;
        syncTransport();
        followEstimate();
      }

      if (state.chunks) {
        /**
         * Long text is synthesised in pieces so speech can start before the
         * whole thing is rendered. That is a synthesis detail, not a visual
         * one: it stays one bubble showing the entire transcript, and the
         * highlight runs straight across the seams between clips.
         */
        let index = 0;
        let next = null;
        let nextIndex = -1;
        // Bumped on every start. A clip abandoned mid-sentence by a click
        // still delivers its own 'ended' afterwards, and without this that
        // would step the clip which replaced it on to the one after.
        let generation = 0;

        const startChunk = (fraction = 0) => {
          const mine = (generation += 1);
          const chunk = state.chunks[index];

          player?.pause();
          // The warmed clip is only the right one if it is the clip we are
          // actually starting; a click can land anywhere in the transcript.
          player = next && nextIndex === index ? next : new Audio(withToken(`/audio/${index}`));
          const current = player;
          next = null;
          nextIndex = -1;
          if (fraction > 0) seekFraction(current, fraction);

          // Warm the following clip while this one plays, so the join is not
          // audible as a gap.
          if (index + 1 < state.chunks.length) {
            next = new Audio(withToken(`/audio/${index + 1}`));
            nextIndex = index + 1;
            next.preload = 'auto';
            next.load();
          }

          watchPlayback(current);
          current.addEventListener('play', () => followAudio(current, chunk));
          current.addEventListener('ended', () => {
            if (mine !== generation) return;
            revealTo(chunk.firstWord + chunk.wordCount);
            index += 1;
            if (index < state.chunks.length) startChunk();
            else speechEnded();
          });
          current.addEventListener('error', () => {
            if (mine !== generation) return;
            speechEnded();
          });
          current.play().catch(() => {
            if (mine !== generation) return;
            fallBackToEstimate();
          });
        };

        seekAudio = (word) => {
          const found = state.chunks.findIndex((c) => word < c.firstWord + c.wordCount);
          index = found === -1 ? state.chunks.length - 1 : found;
          const chunk = state.chunks[index];
          startChunk(fractionAt(word, chunk.firstWord, chunk.firstWord + chunk.wordCount));
        };

        startChunk();
      } else if (state.hasAudio) {
        // The page owns playback, so the highlight and the sound cannot drift.
        player = new Audio(withToken('/audio'));
        watchPlayback(player);
        player.addEventListener('play', () => followAudio(player));
        player.addEventListener('ended', speechEnded);
        player.addEventListener('error', fallBackToEstimate);
        player.play().catch(fallBackToEstimate);

        seekAudio = (word) => {
          seekFraction(player, fractionAt(word, 0, words.length));
          // A clip that will not play is a clip that will never end, so it
          // has to be treated as ended right away.
          player.play().catch(speechEnded);
        };
      } else {
        followEstimate();
        if (window.__SAYNOW__) {
          const events = new EventSource(withToken('/events'));
          events.addEventListener('ended', () => {
            audioEnded = true;
            // Audio finished before the estimate caught up: snap it to done.
            if (!revealFinished) revealAllNow();
            else maybeSettle();
          });
        }
      }

      function revealAllNow() {
        timers.forEach(clearTimeout);
        revealTo(words.length);
      }

      /* ---- pausing and seeking -------------------------------------------- */

      /**
       * Show what the clip is really doing, rather than what it was last asked
       * to do. Read from the element every time, so nothing latches: a flag
       * left saying "paused" would leave a play button on a bubble that had
       * long since finished speaking.
       */
      function syncTransport() {
        const idle = !player || player.paused || player.ended || audioEnded;
        el.bubble.classList.toggle('paused', idle);
        el.play.title = idle ? 'Play (space)' : 'Pause (space)';
        el.play.setAttribute('aria-label', idle ? 'Play' : 'Pause speaking');
      }

      /**
       * Pause and resume.
       *
       * Pausing holds the bubble the way a half-written reply does — a
       * deliberate act, with the same button to undo it. It cancels no
       * countdown, because none runs while there is speech left to hear, and
       * the one it defers is started by that speech reaching its end.
       */
      function togglePlayback() {
        if (!player || !seekAudio) return;
        if (!player.paused && !player.ended) {
          player.pause();
          syncTransport();
          return;
        }
        // Nothing left to resume: play it again from the top rather than sit
        // at the end doing nothing.
        if (audioEnded || player.ended) return seekToWord(0);
        speaking();
        player.play().catch(speechEnded);
        syncTransport();
      }

      /**
       * Play from a word in the transcript.
       *
       * The highlight already knows where every word falls in the audio — that
       * is how it lights them — so the same map read backwards turns a click
       * into somewhere to start speaking from.
       */
      function seekToWord(word) {
        if (!seekAudio) return;
        speaking();
        revealTo(word);
        seekAudio(word);
        syncTransport();
      }

      /* ---- dismiss countdown --------------------------------------------- */

      let dismissTimer = null;

      /**
       * The bubble stays for as long as you are with it.
       *
       * Being there means the pointer on it or a hand on the keyboard, and
       * nothing else. Scrolling used to count too, until documents showed why
       * it cannot: the reveal scrolls the transcript itself, that scroll is
       * indistinguishable from a person's, and it arrived a frame after the
       * countdown began — so every document silently cancelled its own timer
       * and the bar was never seen. Nothing is lost by dropping it, since a
       * scroll goes to whatever is under the pointer, and that is a hover.
       *
       * Moving away starts the countdown again. A reply in progress holds it
       * for as long as the reply exists, because losing a half-written answer
       * is worse than a bubble that outstays its welcome.
       *
       * Both signals have to be things that can end. Flags used to be latched
       * the first time you typed or reached for the box and were never
       * cleared, so a character typed and then deleted held the bubble open
       * for good — with nothing behind it, that is forever. Reading the field
       * cannot get stuck, because an empty box is empty however it got there.
       *
       * Focus is deliberately not one of the signals: the page focuses the
       * reply box itself the moment it loads, and counting that made holding()
       * true forever for every --ask bubble.
       */
      let hovering = false;

      /**
       * The drag in progress on the top edge, or null.
       *
       * A third way of being here, and the one with the least to hold it up: a
       * pointer released outside the window sends no event anyone would notice.
       * Three things end it — the capture being lost, a release anywhere in the
       * page, and a move with no button held — so it cannot be the flag that
       * finally strands a bubble.
       */
      let resizing = null;

      /**
       * Images pasted into the reply, oldest first, each {file, url, thumb}.
       *
       * Part of the draft exactly as typed text is, and read the same way: a
       * picture waiting to be sent holds the bubble, and removing the last one
       * from an empty box gives the countdown back.
       */
      const attachments = [];

      const drafting = () => el.field.value.trim().length > 0 || attachments.length > 0;
      const holding = () => hovering || drafting() || Boolean(resizing);

      function startDismissTimer(ms = state.dismissMs ?? 5000) {
        clearTimeout(dismissTimer);
        if (holding()) return;

        // Snap back to full width with the transition off, then force a
        // reflow before turning it on again. Without the reflow the browser
        // coalesces both writes into one transition, and since the bar was
        // left at scaleX(0) by the previous countdown it animates 0 to 0 —
        // invisible. That is why a second hover-out showed no bar at all.
        el.timer.classList.remove('cancelled');
        el.timer.style.transition = 'none';
        el.timer.style.opacity = '1';
        el.timer.style.transform = 'scaleX(1)';
        void el.timer.offsetWidth;

        el.timer.style.transition = `transform ${ms}ms linear`;
        el.timer.style.transform = 'scaleX(0)';

        dismissTimer = setTimeout(() => close('dismiss'), ms);
      }

      const focusField = () => el.field.focus({ preventScroll: true });

      /** Hold it open: stop the countdown and fade the bar where it stands. */
      function engage() {
        clearTimeout(dismissTimer);
        // Fade the bar out where it stands rather than snapping it away, and
        // leave it ready to be reset when the countdown next starts.
        el.timer.style.transition = 'opacity 0.18s ease';
        el.timer.style.opacity = '0';
      }

      /**
       * Look again at whether anyone is here, and hold or count down to match.
       *
       * Every path that can end an interaction goes through this rather than
       * through engage() alone, so nothing can cancel the countdown without
       * something being able to bring it back.
       */
      function reconsider() {
        if (holding()) engage();
        else if (audioEnded) startDismissTimer();
      }

      /** Speech ended, or the pointer left: start counting down again. */
      function dismissAfter(ms) {
        startDismissTimer(ms);
      }

      /* ---- talking to the CLI -------------------------------------------- */

      const post = (path, body) =>
        fetch(path, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            // A custom header forces a preflight on any cross-origin attempt,
            // which this server never answers.
            'X-Saynow-Token': token,
          },
          body: JSON.stringify(body || {}),
        }).catch(() => {});

      function close(reason, payload) {
        player?.pause();
        el.bubble.classList.add('leaving');
        // /close only once the reason has landed. A reply carrying a pasted
        // screenshot is megabytes, and could still be on the wire when a
        // /close sent on a fixed clock settled the bubble as dismissed.
        post('/' + reason, payload).then(() => setTimeout(() => post('/close'), 260));
      }

      // Given up on after ten seconds rather than waited on for good. A read
      // that never finished would leave "Sent" on screen with the countdown
      // stopped and nothing able to start it again, and the caller waiting on
      // an answer that had already been given.
      const readAsDataUrl = (file) =>
        new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          setTimeout(() => resolve(null), 10000);
          reader.readAsDataURL(file);
        });

      function submit() {
        const text = el.field.value.trim();
        if (!text && !attachments.length) return;
        // Answered: the only thing left to do is close, 420ms from now.
        engage();
        el.reply.classList.add('hidden');
        el.sent.classList.remove('hidden');
        showSender(state.from);
        // Encoded only now, so a picture removed before sending never is. A
        // file that cannot be read is left out rather than allowed to stop the
        // rest of the reply from going.
        const images = Promise.all(attachments.map(({ file }) => readAsDataUrl(file)));
        const shown = new Promise((resolve) => setTimeout(resolve, 420));
        Promise.all([images, shown]).then(([read]) =>
          close('reply', { text, images: read.filter(Boolean) }),
        );
      }

      /* ---- pasted images --------------------------------------------------- */

      // Which types the CLI will save, handed over by it so that nothing is
      // shown as attached that it would then quietly drop.
      const imageTypes = new Set(state.imageTypes ?? []);

      function attach(file) {
        // An object URL rather than a data URL: a full-screen capture is not
        // worth base64-encoding just to draw it 52 pixels tall.
        const entry = { file, url: URL.createObjectURL(file) };

        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        const img = document.createElement('img');
        img.src = entry.url;
        img.alt = file.name || 'Pasted image';
        const remove = document.createElement('button');
        remove.className = 'unattach';
        remove.title = 'Remove';
        remove.setAttribute('aria-label', 'Remove image');
        remove.innerHTML = '<svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>';
        remove.addEventListener('click', () => detach(entry));
        thumb.append(img, remove);

        entry.thumb = thumb;
        attachments.push(entry);
        el.attachments.append(thumb);
        el.attachments.classList.remove('hidden');
      }

      function detach(entry) {
        const at = attachments.indexOf(entry);
        if (at < 0) return;
        attachments.splice(at, 1);
        entry.thumb.remove();
        URL.revokeObjectURL(entry.url);
        el.attachments.classList.toggle('hidden', attachments.length === 0);
        el.send.classList.toggle('ready', drafting());
        focusField();
        reconsider();
      }

      // Only images are taken over. Anything else pastes as it always has —
      // which for a document copied in Finder is its path, and that is what
      // an agent can use.
      el.field.addEventListener('paste', (e) => {
        const images = [...(e.clipboardData?.files ?? [])].filter((f) => imageTypes.has(f.type));
        if (!images.length) return;
        // A picture copied in Finder carries its path as text as well, which
        // would otherwise land in the box beside the thumbnail.
        e.preventDefault?.();
        for (const file of images) attach(file);
        el.send.classList.toggle('ready', drafting());
        reconsider();
      });

      /* ---- wiring --------------------------------------------------------- */

      // A named sender goes in the header, so the spoken sentence can be the
      // question rather than an introduction.
      function showSender(name) {
        if (!name) {
          el.label.className = 'label';
          el.label.textContent = 'saynow';
          return;
        }
        el.label.className = 'label named';
        el.label.textContent = '';

        // "agent · task" or "agent / task": the agent identifies, the task
        // explains, so they should not carry equal weight.
        const [, who, what] = /^(.*?)\s*[·/|—-]\s*(.+)$/.exec(name) ?? [];
        el.label.append(who ?? name);
        if (what) {
          const tail = document.createElement('span');
          tail.className = 'task';
          tail.textContent = what;
          el.label.append(tail);
        }
      }

      showSender(state.from);

      if (state.ask) el.reply.classList.remove('hidden');

      // A half-written reply must never be swallowed by a timer — and an
      // emptied box is no longer half-written, so deleting what you typed
      // hands the bubble back to the countdown rather than freezing it.
      el.field.addEventListener('input', () => {
        el.send.classList.toggle('ready', drafting());
        reconsider();
      });

      // Reaching for the box holds the bubble open. Deliberately not the
      // focus event: the page focuses the field itself on load, and WebKit
      // does not reliably deliver that focus synchronously, so a flag set
      // around our own focus() call cannot be trusted to still be set when
      // the event arrives. A pointer or a key is unambiguously the user.
      el.field.addEventListener('pointerdown', reconsider);
      el.field.addEventListener('mousedown', reconsider);
      el.send.addEventListener('click', submit);

      // Held down, then looked at again on the way up. A key that never
      // becomes text — an arrow, a modifier — would otherwise cancel the
      // countdown with no input event behind it to bring it back.
      el.field.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') return close('dismiss');
        engage(); // typing counts even before the value changes
        if (e.key === 'Enter') submit();
      });

      el.field.addEventListener('keyup', reconsider);

      // A key can also be abandoned rather than released: hold one down, switch
      // window, and the keyup is delivered somewhere else entirely. Looking
      // again when the box or the window loses focus is what stops that one
      // keystroke holding the bubble open for the rest of its life.
      el.field.addEventListener('blur', reconsider);
      window.addEventListener('blur', reconsider);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') close('dismiss');
      });

      el.close.addEventListener('click', () => close('dismiss'));

      el.bubble.addEventListener('mouseenter', () => {
        hovering = true;
        engage();
      });

      // A click anywhere inside is unambiguous: they are using this. It holds
      // only until the pointer leaves, though — the countdown it stops is the
      // one the pointer will start again on the way out. Reconsidered rather
      // than simply stopped, because a click does not prove the pointer is
      // here: Space on a focused button is a click too, and mouseleave has
      // long since been and gone.
      el.bubble.addEventListener('click', reconsider);

      el.bubble.addEventListener('mouseleave', () => {
        hovering = false;
        // Only resume once speech is over; mid-sentence there is nothing to
        // count down yet.
        if (audioEnded) dismissAfter(state.ask ? undefined : 1200);
      });

      // Pausing and seeking need a playhead in this page. With the system
      // voice speaking for itself there is none, so neither is offered —
      // rather than shown, clicked, and quietly ignored.
      if (seekAudio) {
        el.play.classList.remove('hidden');
        el.transcript.classList.add('seekable');
        syncTransport();
      }

      el.play.addEventListener('click', () => {
        togglePlayback();
        // The pointer is on the button, so it is already holding the bubble
        // open. Looked at again rather than assumed, because a click is not
        // proof of a pointer: Space on a focused button is a click too.
        reconsider();
        // Hand the keyboard back to the reply box. Left on the button, the
        // next space would work the button instead of typing a space, and an
        // answer half typed is worth more than a keyboard shortcut.
        if (state.ask) focusField();
      });

      // Clicking a word plays from that word.
      el.transcript.addEventListener('click', (event) => {
        if (!seekAudio) return;
        const word = event.target?.closest?.('w');
        // A link is a link first. And a drag across the transcript ends in a
        // click too, which is someone copying it rather than asking to hear
        // that part again.
        if (!word || word.closest('a')) return;
        const selection = window.getSelection?.();
        if (selection && !selection.isCollapsed) return;

        const at = nodes.indexOf(word);
        if (at >= 0) seekToWord(at);
        if (state.ask) focusField();
      });

      /* ---- resizing -------------------------------------------------------- */

      /**
       * Drag the top edge for more or less of the transcript.
       *
       * Nothing here moves a window. The panel is pinned to the bottom-right
       * corner and follows the height the page reports, so a taller transcript
       * grows the bubble upwards on its own.
       *
       * Measured in screen coordinates, never page ones: the drag resizes the
       * very page it would be measured against, so a hand held still would
       * read as moving and the edge would run away from it.
       */
      function resizeTranscript(height) {
        const chrome = el.bubble.offsetHeight - el.transcript.offsetHeight;
        // The panel takes the page's word for its height and would happily run
        // off the top of the screen; the browser fallback cannot outgrow its
        // window at all.
        const room = sizeChannel
          ? (window.screen?.availHeight ?? 900) - 40
          : (window.innerHeight ?? 900) - 8;
        el.transcript.style.maxHeight = `${Math.max(48, Math.min(height, room - chrome))}px`;
      }

      el.grip.addEventListener('pointerdown', (e) => {
        resizing = { from: e.screenY ?? 0, height: el.transcript.offsetHeight };
        el.bubble.classList.add('resizing');
        // Keeps the moves coming when the pointer outruns the edge, which it
        // will: the bubble only grows as fast as the transcript has content.
        el.grip.setPointerCapture?.(e.pointerId);
        e.preventDefault?.();
        reconsider();
      });

      // On the document rather than the handle: a captured move still bubbles
      // here, and without capture this is the only way to hear a pointer that
      // has left a strip twelve pixels tall — which it does immediately.
      document.addEventListener('pointermove', (e) => {
        if (!resizing) return;
        // Released somewhere nobody told us about — outside the window, or
        // with the capture taken away. A move with no button held ends it.
        if (e.buttons === 0) return endResize();
        resizeTranscript(resizing.height + (resizing.from - (e.screenY ?? 0)));
      });

      /** Let go of the edge, and hand the bubble back to the countdown. */
      function endResize() {
        if (!resizing) return;
        resizing = null;
        el.bubble.classList.remove('resizing');
        reconsider();
      }

      // lostpointercapture arrives however the drag ends while captured. The
      // rest are for a shell that has no pointer capture to lose, where a
      // release still has to be heard wherever in the page it happens.
      el.grip.addEventListener('lostpointercapture', endResize);
      document.addEventListener('pointerup', endResize);
      document.addEventListener('pointercancel', endResize);
      window.addEventListener('blur', endResize);

      // Space is the universal play/pause — but it is also a character, so
      // with a reply half typed the reply box wins.
      document.addEventListener('keydown', (e) => {
        if (e.key !== ' ' || document.activeElement === el.field) return;
        e.preventDefault?.();
        togglePlayback();
        reconsider();
      });

      // Focus immediately, not after the entrance animation. Any delay here
      // silently swallows the first characters of a fast reply.
      if (state.ask) {
        focusField();
        // The panel takes key status a beat after the page loads, so claim
        // focus again once it does rather than waiting a fixed interval.
        window.addEventListener('focus', focusField);
        requestAnimationFrame(focusField);
      }

      /* ---- tell the native shell how tall we are -------------------------- */

      if (sizeChannel) {
        // offsetHeight is the laid-out height. getBoundingClientRect would
        // include the entrance scale transform and report a size that is wrong
        // for the first few frames.
        const report = () =>
          sizeChannel.postMessage({
            width: el.bubble.offsetWidth,
            height: el.bubble.offsetHeight,
          });
        new ResizeObserver(report).observe(el.bubble);
        report();
      }
    </script>
  </body>
</html>
